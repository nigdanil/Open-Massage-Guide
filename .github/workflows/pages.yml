name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install Pillow

      - name: Validate modular content
        run: node scripts/validate-content.mjs

      - name: Report editorial coverage
        run: node scripts/editorial-report.mjs

      - name: Validate publishing configuration
        run: node scripts/check-publishing.mjs

      - name: Validate social launch configuration
        run: node scripts/check-social-launch.mjs

      - name: Validate social card configuration
        run: node scripts/check-social-cards.mjs

      - name: Validate image references
        run: python scripts/check_image_links.py

      - name: Validate image specification
        run: python scripts/check_image_spec.py

      - name: Validate analytics configuration
        run: node scripts/check-analytics.mjs

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production site
        run: node scripts/build-site.mjs

      - name: Smoke-check production build
        run: node scripts/check-build.mjs

      - name: Install UI test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test social card generator
        run: |
          node scripts/build-social-card.mjs --id=back-001 --lang=ru --format=feed
          node scripts/build-social-card.mjs --id=back-001 --lang=ru --format=story
          node scripts/check-social-card-output.mjs --file=dist/social/back-001.ru.feed.png --width=1080 --height=1350
          node scripts/check-social-card-output.mjs --file=dist/social/back-001.ru.story.png --width=1080 --height=1920

      - name: Run UI smoke tests
        run: npm run test:smoke:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
